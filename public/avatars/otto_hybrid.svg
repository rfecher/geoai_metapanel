<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%; display: block;">
  <defs>
    <clipPath id="avatarClip">
      <rect x="0" y="0" width="400" height="400" rx="28" ry="28"></rect>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"></feGaussianBlur>
      <feOffset in="blur" dx="0" dy="1" result="offset"></feOffset>
      <feMerge>
        <feMergeNode in="offset"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <!-- Subtle edge softener for overlays -->
    <filter id="softEdge" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.35"></feGaussianBlur>
    </filter>

    <!-- Eyelid gradients: darker at lash line, fade to transparent across thickness -->
    <linearGradient id="gradLidUpper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#46322a" stop-opacity="0.85"></stop>
      <stop offset="100%" stop-color="#46322a" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="gradLidLower" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#46322a" stop-opacity="0.85"></stop>
      <stop offset="100%" stop-color="#46322a" stop-opacity="0"></stop>
    </linearGradient>

    <!-- Very subtle sclera highlight gradient -->
    <linearGradient id="gradEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1.0"></stop>
    </linearGradient>

    <!-- Pupil soft edge -->
    <radialGradient id="gradPupil" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#17100e" stop-opacity="0.95"></stop>
      <stop offset="100%" stop-color="#17100e" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Mouth vertical gradient (slightly darker near top/bottom, warmer center) -->
    <linearGradient id="gradMouthVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90574f" stop-opacity="0.7"></stop>
      <stop offset="50%" stop-color="#773d42" stop-opacity="0.8"></stop>
      <stop offset="100%" stop-color="#a96a71" stop-opacity="0.7"></stop>
    </linearGradient>

    <!-- Slightly stronger feather just for mouth edges -->
    <filter id="mouthFeather" x="-6%" y="-6%" width="112%" height="112%">
      <feGaussianBlur stdDeviation="0.55"></feGaussianBlur>
    </filter>
  </defs>

  <!-- Rig root: transforms applied here for head motion; origin near neck/upper chest -->
  <g id="rigRoot" clip-path="url(#avatarClip)" style="transform-origin: 200px 170px; transform-box: view-box; transform: translate(0px, -0.134px) rotate(-0.617deg);">
    <!-- Photo base (realistic!) -->
    <image href="/avatars/otto-eyes.png" x="0" y="0" width="400" height="400" preserveAspectRatio="xMidYMid slice"></image>

    <!-- Eyes overlay (positions derived from faceAnchors: eyes y ≈ 33.33% of 400 = ~133px) -->
    <g id="eyes">
      <!-- Optional subtle eye highlights; sclera overlays kept faint so the photo remains visible -->
      <ellipse id="eyeL" cx="172" cy="166" rx="14" ry="5" fill="url(#gradEye)" opacity="0.12" filter="url(#softShadow)"></ellipse>
      <ellipse id="eyeR" cx="245" cy="166" rx="14" ry="5" fill="url(#gradEye)" opacity="0.12" filter="url(#softShadow)"></ellipse>

      <!-- Pupils (kept small; you can animate gaze later by translating x/y slightly) -->
      <circle id="pupilL" cx="173" cy="166" r="7" fill="url(#gradPupil)" opacity="0.9" filter="url(#softEdge)" style="transform-box: fill-box; transform: translate(var(--gazeDx, 0px), var(--gazeDy, 0px)); --gazeDx: 0px; --gazeDy: 0px; transition: transform 452.304ms cubic-bezier(0.2, 0, 0.2, 1);"></circle>
      <circle id="pupilR" cx="245" cy="165" r="7" fill="url(#gradPupil)" opacity="0.9" filter="url(#softEdge)" style="transform-box: fill-box; transform: translate(var(--gazeDx, 0px), var(--gazeDy, 0px)); --gazeDx: 0px; --gazeDy: 0px; transition: transform 452.304ms cubic-bezier(0.2, 0, 0.2, 1);"></circle>
      <!-- Tiny corneal highlights -->
      <ellipse cx="162" cy="131.5" rx="1.1" ry="0.7" fill="#fff" opacity="0.18" filter="url(#softEdge)"></ellipse>
      <ellipse cx="222" cy="131.5" rx="1.0" ry="0.6" fill="#fff" opacity="0.18" filter="url(#softEdge)"></ellipse>

      <!-- Eyelids (animated via React by scaling in Y). Colors chosen to match typical lash tones. -->
      <rect id="lidUpperL" x="158" y="160" width="25" height="5" rx="2" ry="2" fill="url(#gradLidUpper)" opacity="0" filter="url(#softEdge)" style="transform-origin: 50% 0%; transform-box: fill-box; transition: transform 140ms linear, opacity 140ms linear;"></rect>
      <rect id="lidLowerL" x="156" y="166" width="25" height="5" rx="2" ry="2" fill="url(#gradLidLower)" opacity="0" filter="url(#softEdge)" style="transform-origin: 50% 100%; transform-box: fill-box; transition: transform 140ms linear, opacity 140ms linear;"></rect>
      <rect id="lidUpperR" x="230" y="160" width="25" height="5" rx="2" ry="2" fill="url(#gradLidUpper)" opacity="0" filter="url(#softEdge)" style="transform-origin: 50% 0%; transform-box: fill-box; transition: transform 140ms linear, opacity 140ms linear;"></rect>
      <rect id="lidLowerR" x="232" y="166" width="25" height="5" rx="2" ry="2" fill="url(#gradLidLower)" opacity="0" filter="url(#softEdge)" style="transform-origin: 50% 100%; transform-box: fill-box; transition: transform 140ms linear, opacity 140ms linear;"></rect>
    </g>

    <!-- Mouth overlay (y ≈ 54.95% of 400 = ~220px). React updates rx/ry/cy/opacity for visemes. -->
    <ellipse id="mouthShape" cx="211" cy="246" rx="19" ry="1" fill="url(#gradMouthVert)" opacity="0.72" filter="url(#mouthFeather)" style="transition: opacity 100ms ease-out;"></ellipse>
  </g>
</svg>