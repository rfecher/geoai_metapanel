<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f7caa0"/>
      <stop offset="100%" stop-color="#d9a978"/>
    </radialGradient>
    <clipPath id="avatarClip">
      <rect x="0" y="0" width="400" height="400" rx="28" ry="28" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="400" fill="#23262b" clip-path="url(#avatarClip)"/>

  <!-- Head (very simple stylized bust) -->
  <g id="head" transform="translate(0,10)" clip-path="url(#avatarClip)">
    <circle cx="200" cy="180" r="120" fill="url(#faceGrad)"/>
    <!-- Hair silhouette -->
    <path d="M90,180c0,-70 60,-110 110,-110c60,0 110,40 110,110c0,0 -38,-35 -110,-35c-72,0 -110,35 -110,35z" fill="#2b2d33" opacity="0.95"/>
  </g>

  <!-- Eyes region -->
  <g id="eyes" transform="translate(0,0)">
    <!-- Sclera -->
    <ellipse id="eyeL" cx="150" cy="160" rx="26" ry="12" fill="#fff" opacity="0.9"/>
    <ellipse id="eyeR" cx="250" cy="160" rx="26" ry="12" fill="#fff" opacity="0.9"/>
    <!-- Pupils -->
    <circle id="pupilL" cx="150" cy="160" r="6" fill="#111"/>
    <circle id="pupilR" cx="250" cy="160" r="6" fill="#111"/>
    <!-- Eyelids (animated by outer React) -->
    <rect id="lidUpperL" x="124" y="148" width="52" height="12" fill="#2b2d33" opacity="0" style="transform-origin:50% 0%"/>
    <rect id="lidLowerL" x="124" y="160" width="52" height="12" fill="#2b2d33" opacity="0" style="transform-origin:50% 100%"/>
    <rect id="lidUpperR" x="224" y="148" width="52" height="12" fill="#2b2d33" opacity="0" style="transform-origin:50% 0%"/>
    <rect id="lidLowerR" x="224" y="160" width="52" height="12" fill="#2b2d33" opacity="0" style="transform-origin:50% 100%"/>
  </g>

  <!-- Nose hint -->
  <path d="M200,170 c -4,12 4,16 0,26" stroke="#ad845c" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Mouth (ellipse; React updates rx/ry/cy/opacity) -->
  <ellipse id="mouthShape" cx="200" cy="200" rx="12" ry="2" fill="#441e1e" opacity="0.8"/>

  <!-- Shoulders -->
  <path d="M70,320 c 40,-40 220,-40 260,0 l 0,90 l -300,0 z" fill="#1c1f23"/>
</svg>

